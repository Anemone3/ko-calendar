[package]
name = "ko-calendar"
version = "0.4.4"
edition = "2024"
rust-version = "1.90"
description = "Calendario con Google para escritorios Linux y Windows."
license = "MIT"
repository = "https://github.com/Anemone3/ko-calendar"

# The library keeps its original crate name so `kokonut_calendar::…` paths stay valid.
[lib]
name = "kokonut_calendar"
path = "src/lib.rs"

[[bin]]
name = "ko-calendar"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "svg", "advanced", "x11", "wayland", "linux-theme-detection"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
directories = "6"
fs2 = "0.4"
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "net", "io-util"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5"
regex-automata = { version = "0.4", default-features = false, features = ["std", "meta", "syntax"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "mp3"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-registry = "0.6"
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
notify-rust = "4.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
